name: Release asset

# Attaches the built card to each release. HACS then downloads it from the
# release and shows its download count.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the card to (e.g. v2.0.2)
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node scripts/build.mjs && node --check solar-flow-card.js
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" solar-flow-card.js --clobber --repo "$GITHUB_REPOSITORY"
