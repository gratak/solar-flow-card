<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Energy Hub demo</title>
  <style>
    body { margin: 0; padding: 20px; font-family: system-ui, sans-serif; background: #1b1d22; color: #e8eaf0; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 18px; }
    .bar label { font-size: 13px; color: #9aa3b2; }
    .bar select { margin-left: 6px; padding: 5px 8px; border-radius: 8px; background: #2a2e37; color: inherit; border: 1px solid #3a3f4b; }
    .cards { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
    .cards > div { width: var(--w, 520px); max-width: 100%; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Home Energy Hub <small id="version"></small></strong>
    <label>Theme <select id="theme"><option>all</option><option>diorama</option><option>aurora</option><option>paper</option><option>lcars</option><option>atlantis</option><option>expanse</option><option>foundation</option><option>galaxy</option><option>gate</option><option>reactor</option></select></label>
    <label>Scenario <select id="scenario"></select></label>
    <label>Language <select id="language"><option>pl</option><option>en</option><option>nl</option></select></label>
    <label>PV <select id="solar"><option value="1">yes</option><option value="0">no (EMS)</option></select></label>
    <label>Weather <select id="weather"><option value="">scenario</option><option>sunny</option><option>partlycloudy</option><option>cloudy</option><option>rainy</option><option>pouring</option><option>lightning-rainy</option><option>snowy</option><option>fog</option><option>windy</option><option>clear-night</option></select></label>
    <label>Battery <select id="battery"><option value="1">yes</option><option value="2">two batteries</option><option value="0">no</option></select></label>
    <label>Width <select id="width"><option>520</option><option>420</option><option>360</option><option>700</option><option>1100</option><option>1600</option></select></label>
    <label>Panels <select id="panels"><option value="opt">optimizers</option><option value="est">no optimizers (estimate)</option></select></label>
    <label>Layout <select id="wide"><option value="0">standard</option><option value="1">wide</option></select></label>
  </div>
  <div class="cards" id="cards"></div>
  <script>
    customElements.define("ha-card", class extends HTMLElement {});
    // The demo clock follows the scenario (noon, evening, night…), so themes
    // that react to the time of day, like the Diorama sky, match the data.
    // The card reads the global Date, which is replaced here.
    (() => {
      const RealDate = Date;
      let offset = 0;
      class DemoDate extends RealDate {
        constructor(...args) { if (args.length) super(...args); else super(RealDate.now() + offset); }
        static now() { return RealDate.now() + offset; }
      }
      window.Date = DemoDate;
      window.setDemoHour = (hour) => {
        const target = new RealDate();
        target.setHours(Math.floor(hour), Math.round((hour % 1) * 60), 0, 0);
        offset = target.getTime() - RealDate.now();
      };
    })();
  </script>
  <script type="module">
    // Load the card and the mock fresh on every visit: GitHub Pages lets the
    // browser cache them, which would show an older card after an update.
    const fresh = `?v=${Date.now()}`;
    await import(`../solar-flow-card.js${fresh}`);
    const { createHass, SCENARIOS } = await import(`./mock-hass.js${fresh}`);

    const params = new URLSearchParams(location.search);
    const $ = (id) => document.getElementById(id);
    $("scenario").innerHTML = Object.entries(SCENARIOS).map(([key, s]) => `<option value="${key}">${s.label}</option>`).join("");
    for (const id of ["theme", "scenario", "language", "width", "solar", "battery", "weather", "wide", "panels"]) {
      if (params.get(id)) {
        // Lets ?language=de show a new translation before the demo lists it.
        if (![...$(id).options].some((o) => o.value === params.get(id))) $(id).add(new Option(params.get(id)));
        $(id).value = params.get(id);
      }
      $(id).addEventListener("change", render);
    }
    // A wide card is what the wide layout is for: switch it on with the width.
    $("width").addEventListener("change", () => {
      if (Number($("width").value) >= 1100 && $("wide").value === "0") {
        $("wide").value = "1";
        render();
      }
    }, { capture: true });

    function render() {
      const themes = $("theme").value === "all" ? ["diorama", "aurora", "paper", "lcars", "atlantis", "expanse", "foundation", "galaxy", "gate", "reactor"] : [$("theme").value];
      window.setDemoHour(SCENARIOS[$("scenario").value].hour);
      const hass = createHass({ scenario: $("scenario").value, language: $("language").value, weather: $("weather").value || undefined, optimizers: $("panels").value !== "est" });
      const cards = $("cards");
      cards.style.setProperty("--w", `${$("width").value}px`);
      cards.innerHTML = "";
      for (const theme of themes) {
        const wrap = document.createElement("div");
        const card = document.createElement("home-energy-hub");
        card.setConfig({
          theme,
          battery_capacity: 23.5,
          battery_min_soc: 10,
          pv_capacity: 8,
          price_import: 1.1,
          price_export: 0.3,
          co2_factor: 0.7,
          period: params.get("period") || undefined,
          show_solar: $("solar").value === "0" ? false : undefined,
          show_battery: $("battery").value === "0" ? false : undefined,
          wide: $("wide").value === "1" ? true : undefined,
          panels_per_string: $("panels").value === "est" ? 8 : undefined,
          pv_panels: $("panels").value === "est" ? 16 : undefined,
          batteries: $("battery").value === "2" ? [
            { name: "LiFePO4 48 V", soc: "sensor.lfp_soc", power: "sensor.lfp_power", voltage: "sensor.lfp_voltage", temperature: "sensor.lfp_temperature", capacity: 10 },
            { name: "HV 200 V", soc: "sensor.hv_soc", power: "sensor.hv_power", voltage: "sensor.hv_voltage", temperature: "sensor.hv_temperature", capacity: 13.5 },
          ] : undefined,
        });
        card.hass = hass;
        wrap.appendChild(card);
        cards.appendChild(wrap);
      }
    }
    render();
    const card = document.querySelector("home-energy-hub");
    $("version").textContent = card?.constructor.version ? `v${card.constructor.version}` : "";
    window.demoReady = true;
  </script>
</body>
</html>
